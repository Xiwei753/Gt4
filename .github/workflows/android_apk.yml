# SPDX-License-Identifier: GPL-3.0-only
# Android APK build for suyue (issue #3).
#
# 说明：
#   - 这是普通 GitHub 托管 runner（ubuntu-latest），不占 #2 的
#     self-hosted hmos-deveco 队列；#2 卡住也不影响这里。
#   - 源码级测试（tests/*.test.mjs）由 pagination-test.yml 跑；
#     本 workflow 只负责真实 Gradle 编译出 APK 并上传产物。
#   - 没有正式签名 Secrets 时，只出 **debug APK**，仅可用于界面/
#     导入功能的本地安装测试；它 **不能** 作为 Wear Engine 配对
#     成功的证据（debug 证书指纹不是手表端认可的正式指纹）。
#   - 有 SUYUE_ANDROID_KEYSTORE_BASE64 等 Secrets 时出 release 包，
#     并把 SUYUE_ANDROID_WATCH_FINGERPRINT 注入到 App 里（构建后还原）。
name: android-apk

on:
  push:
    branches: [auto-issue-3, main]
    paths:
      - 'android/**'
      - 'tools/build_android_apk.sh'
      - '.github/workflows/android_apk.yml'
      - 'protocol/**'
      - 'tests/android-protocol.test.mjs'
  pull_request:
    paths:
      - 'android/**'
      - 'tools/build_android_apk.sh'
      - '.github/workflows/android_apk.yml'
      - 'protocol/**'
      - 'tests/android-protocol.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK components
        run: |
          if [ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "platforms;android-36" "build-tools;36.0.0" || true
          fi
          ls "$ANDROID_HOME/build-tools"

      - name: Detect signing secrets
        id: signing
        env:
          KS_B64: ${{ secrets.SUYUE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        if: steps.signing.outputs.has_secrets == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.SUYUE_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SUYUE_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SUYUE_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SUYUE_ANDROID_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/suyue-android.keystore"
          echo "$KEYSTORE_B64" | base64 -d > "$KS"
          {
            echo "SUYUE_ANDROID_KEYSTORE_PATH=$KS"
            echo "SUYUE_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "SUYUE_ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "SUYUE_ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        if: steps.signing.outputs.has_secrets == 'true'
        env:
          SUYUE_ANDROID_WATCH_FINGERPRINT: ${{ secrets.SUYUE_ANDROID_WATCH_FINGERPRINT }}
        run: ./tools/build_android_apk.sh release

      - name: Build debug APK (no signing secrets)
        if: steps.signing.outputs.has_secrets != 'true'
        run: ./tools/build_android_apk.sh debug

      - name: Locate APK
        id: apk
        run: |
          APK="$(find android/app/build/outputs/apk -name '*.apk' -type f | head -n 1)"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          ls -l "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Cleanup signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/suyue-android.keystore"
