name: Watch Lite HAP build (self-hosted DevEco required)
# 源码检查（pagination-test.yml）不等于 HAP 构建。本 workflow 必须运行在
# 已安装 Lite Wearable 工具链的自托管 runner 上；GitHub-hosted
# ubuntu-latest 没有 hvigor 与 Lite SDK，会直接失败。
#
# 【本机已实测可用的工具链（issue #2）】
#   HarmonyOS Command Line Tools 26.0.0.821（Linux x64）
#     /home/xiwei/.harmony-cli/bin/hvigorw
#     $HOME/.harmony-cli/sdk/default/openharmony/js  ← Lite JS SDK
#       （含 @system.file / @system.device / @system.router / @system.storage）
#     $HOME/.harmony-cli/sdk/default/openharmony/toolchains/lib/hap-sign-tool.jar
#   DEVECO_SDK_HOME=$HOME/.harmony-cli/sdk 由 hvigorw 包一层自动设置。
#
# 【为什么这个 job 会长期 queued】
#   `runs-on: [self-hosted, hmos-deveco]` 需要有人真的注册这样一台
#   runner；GitHub 托管机装不了 Lite SDK。没有 runner 时 job 只会排队，
#   不会失败——这不是"构建通过"，也不是"构建失败"，而是"从未运行"。
#   在 runner 注册之前，第 1 阶段的真实构建证据只能来自本机
#   `tools/build_watch_lite.sh debug` 的日志与产物体积/SHA256。
#
# 签名材料（secrets.WATCH_SIGNING_MATERIAL，JSON）：
#   storeFileB64/certpathB64/profileB64: base64 编码的签名文件
#   keyAlias/keyPassword/storePassword: 口令
#   signAlg: 默认 SHA256withECDSA（Lite sign-app 固定此算法）
#   fingerprints: {"phone": <手机APP ID>, ...}
#   —— 手表是 Lite Wearable，华为 FAQ（2026-09-20）规定它登记
#      HarmonyOS 5.0+ 手机原生应用时必须使用手机 **APP ID**
#      （bundle-info.app-identifier），不是证书 SHA-256、不是 OAuth
#      Client ID、也不是 GT4 的 Lite 公钥指纹。
#      手机 APP ID 同时注入：
#        (a) 手表 JS PhonePeerConfig.g.js（setFingerprint 门控）；
#        (b) 手表 Manifest config.json 的 supportLists（系统级授权接收）。
#      两处必须一致；构建后从最终 HAP 内层 BIN 再核对一次。
#
# 手机 APP ID 优先从 secrets.PHONE_SIGNING_MATERIAL 的 profile 解析；
# 不要使用 WATCH_SIGNING_MATERIAL.fingerprints.phone 的 SHA-256。
on:
  push:
    branches: [main, 'auto-issue-*']
    paths:
      - 'apps/watch/**'
      - 'tools/build_watch_lite.sh'
      - 'tools/inject_signing.py'
      - 'tools/extract_phone_app_id.py'
      - 'tools/peer_identity_formats.py'
      - 'tests/build_artifact_check.sh'
      - '.github/workflows/watch_lite_hap.yml'
  workflow_dispatch:

jobs:
  watch-lite-hap:
    runs-on: [self-hosted, hmos-deveco]
    steps:
      - uses: actions/checkout@v4

      - name: Verify signing material is present
        env:
          WATCH_SIGNING_MATERIAL: ${{ secrets.WATCH_SIGNING_MATERIAL }}
        run: |
          if [ -z "$WATCH_SIGNING_MATERIAL" ]; then
            echo "ERROR: 签名材料缺失（secrets.WATCH_SIGNING_MATERIAL 未配置）。" >&2
            echo "未签名构建不能标记为成功；请先配置 GT4 Lite 签名材料。" >&2
            exit 1
          fi

      - name: Stage watch signing material
        # 材料写入 $RUNNER_TEMP（跨 step 持久），
        # 不把 signingConfigs 注入 legacy Lite 构建（会触发 SignHap 错误）。
        # 不在本 step 末尾删除（旧实现的 trap
        # 会在本 step 结束时删掉材料，导致
        # 构建 step 读不到——施工单 P1-7）。
        # 身份注入由 build_watch_lite.sh 在构建前统一完成并还原。
        env:
          WATCH_SIGNING_MATERIAL: ${{ secrets.WATCH_SIGNING_MATERIAL }}
        run: |
          python3 tools/inject_signing.py \
            --material-json "$WATCH_SIGNING_MATERIAL" \
            --signing-dir "$RUNNER_TEMP/suyue-signing" \
            --external-signing

      - name: Export phone APP ID from real phone profile
        id: phone-app-id
        env:
          PHONE_SIGNING_MATERIAL: ${{ secrets.PHONE_SIGNING_MATERIAL }}
        run: |
          if [ -z "$PHONE_SIGNING_MATERIAL" ]; then
            echo "ERROR: 缺少 secrets.PHONE_SIGNING_MATERIAL，无法取得手机 APP ID。" >&2
            echo "不能用手表材料里的 SHA-256 代替。" >&2
            exit 1
          fi
          APP_ID="$(python3 tools/extract_phone_app_id.py \
            --material-json "$PHONE_SIGNING_MATERIAL" \
            --bundle com.xiwei.suyue)"
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"

      - name: Build and sign Lite Wearable HAP
        env:
          WATCH_SIGNING_DIR: ${{ runner.temp }}/suyue-signing
          HAP_SIGN_TOOL_JAR: ${{ vars.HAP_SIGN_TOOL_JAR }}
          SUYUE_PHONE_APP_ID: ${{ steps.phone-app-id.outputs.app_id }}
        # GT 4 真机调试采用 Debug profile，先构建与其匹配的 Debug HAP。
        # Release 构建 + Debug profile 在旧版 DevEco Assistant 上尚未经实机验证。
        run: tools/build_watch_lite.sh debug

      - name: Locate HAP
        id: hap
        run: |
          HAP="$(find apps/watch/entry/build/default/outputs/default -name 'entry-default-debug-signed.hap' -type f | head -n 1)"
          if [ -z "$HAP" ]; then
            echo "ERROR: signed debug HAP not found" >&2
            exit 1
          fi
          echo "path=$HAP" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$HAP")" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$HAP")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$HAP" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Verify final Lite BIN contains phone APP ID
        # 构建脚本退出时已还原源码 config.json，所以这里不能再看源码；
        # 直接核对最终 HAP 内层 BIN 的 supportLists。不能把「JS 里有
        # APP ID」当「手表已授权接收」，也不能用 SHA-256 冒充。
        run: |
          APP_ID="${{ steps.phone-app-id.outputs.app_id }}"
          if ! unzip -p "${{ steps.hap.outputs.path }}" '*.bin' 2>/dev/null \
              | strings | grep -F "com.xiwei.suyue:$APP_ID" >/dev/null; then
            echo "ERROR: 最终 HAP 内层 BIN 未包含 supportLists=com.xiwei.suyue:$APP_ID" >&2
            exit 1
          fi
          echo "WATCH_PHONE_APP_ID_IN_BIN=yes"

      # 已删除旧步骤「Verify actual delivered BIN signature with hap-sign-tool」：
      # 本机工具对 0xBE 的 GT Lite 单 bin 必走 ELF 校验路径而失败——在那里裸调
      # 官方验签命令是**必然失败**的重复调用。签名与「受限验签兼容分支」统一由
      # tools/sign_hap.sh（经 tools/build_watch_lite.sh 调用）负责，本 workflow
      # 与本地使用同一份规则，避免两处漂移。普通 HAP/Stage 的严格验签逻辑仍保留
      # 在 sign_hap.sh 内，未做全局关闭。

      - name: Report artifact identity
        run: |
          echo "HAP name: ${{ steps.hap.outputs.name }}"
          echo "HAP size: ${{ steps.hap.outputs.size }} bytes"
          echo "HAP sha256: ${{ steps.hap.outputs.sha256 }}"

      - name: Upload Lite HAP only
        uses: actions/upload-artifact@v4
        with:
          name: suyue-watch-lite-hap
          path: ${{ steps.hap.outputs.path }}
          if-no-files-found: error

      - name: Remove signing material and restore configs
        # 无论构建成败都执行：签名材料与注入的手机 APP ID
        # 不得残留在工作区（P1-7/P0-1）。
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/suyue-signing"
          git checkout -- apps/watch/build-profile.json5 \
            apps/watch/entry/src/main/js/MainAbility/wear/PhonePeerConfig.g.js \
            apps/watch/entry/src/main/config.json
          echo "signing material removed; configs restored"
