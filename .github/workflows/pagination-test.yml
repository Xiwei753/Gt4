name: Source-only checks (not HAP build)
on:
  push:
    paths:
      - 'watch/huawei/watch-lite/**'
      - 'harmony/**'
      - 'android/**'
      - 'protocol/**'
      - 'tests/**'
      - 'tools/**'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/pagination-test.yml'
  pull_request:
  workflow_dispatch:
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 全部源码级测试一次跑完（新增用例自动纳入，
      # 不再逐个登记，避免与 tests/ 目录漂移）。
      # 注意：源码检查不等于 HAP 构建，也不等于
      # 真机互通。
      - name: Run all source-only suites
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(tests/*.test.mjs)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no test files found" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "== $f"
            node "$f"
          done
          echo "all ${#files[@]} source-only suites passed"
