name: Phone Stage HAP build (self-hosted DevEco required)
# 源码检查（pagination-test.yml）不等于 HAP 构建。本 workflow 必须运行在
# 已安装 HarmonyOS Stage (API 26) DevEco 工具链的自托管 runner 上。
#
# 签名材料（secrets.PHONE_SIGNING_MATERIAL，JSON）：
#   storeFileB64/certpathB64/profileB64: base64 编码的签名文件
#   keyAlias/keyPassword/storePassword: 口令
#   signAlg: 默认 SHA256withECDSA
#   fingerprints: {"phone": 64位hex, "watch": 64位hex}
#   —— fingerprints.watch 必须是**当前 GT 4 HAP 签名证书的 DER-SHA256**，
#     不是手机 HAP/APK 指纹、HAP 文件哈希或公钥哈希。两端 profile
#     可能复用同一张账号级证书，摘要相同是允许的；身份按
#     bundleName + fingerprint 区分。
#   手表证书指纹注入手机侧 PeerIdentityConfig.g.ts，作为 remoteApp
#   用于发送与回执校验；最终 HAP 的 ets/modules.abc 会再核对一次。
#   材料只在构建生命周期内存在，结束步骤（if: always()）统一清理。
on:
  push:
    branches: [main, 'auto-issue-*']
    paths:
      - 'apps/phone/**'
      - 'tools/build_phone_hap.sh'
      - 'tools/inject_signing.py'
      - 'tests/build_artifact_check.sh'
      - '.github/workflows/phone_hap.yml'
  workflow_dispatch:

jobs:
  phone-hap:
    runs-on: [self-hosted, hmos-deveco]
    steps:
      - uses: actions/checkout@v4

      - name: Verify signing material is present
        env:
          PHONE_SIGNING_MATERIAL: ${{ secrets.PHONE_SIGNING_MATERIAL }}
        run: |
          if [ -z "$PHONE_SIGNING_MATERIAL" ]; then
            echo "ERROR: 签名材料缺失（secrets.PHONE_SIGNING_MATERIAL 未配置）。" >&2
            echo "未签名构建不能标记为成功；请先配置手机 Stage 签名材料。" >&2
            exit 1
          fi

      - name: Stage signing material and signingConfigs
        # 材料写入 $RUNNER_TEMP（跨 step 持久），
        # 不在本 step 末尾删除（旧实现的 trap
        # 会在本 step 结束时删掉材料，导致
        # 构建 step 读不到——施工单 P1-7）。
        env:
          PHONE_SIGNING_MATERIAL: ${{ secrets.PHONE_SIGNING_MATERIAL }}
        run: |
          python3 tools/inject_signing.py \
            --material-json "$PHONE_SIGNING_MATERIAL" \
            --signing-dir "$RUNNER_TEMP/suyue-signing" \
            --build-profile apps/phone/build-profile.json5 \
            --identity-file apps/phone/entry/src/main/ets/services/PeerIdentityConfig.g.ts \
            --identity-var INJECTED_WATCH_FINGERPRINT \
            --fingerprint-key watch \
            --fingerprint-format hex64

      - name: Export watch fingerprint for build-time cross-check
        id: watch-fingerprint
        env:
          PHONE_SIGNING_MATERIAL: ${{ secrets.PHONE_SIGNING_MATERIAL }}
        run: |
          FP="$(python3 - <<'PY'
          import json, os
          material = json.loads(os.environ["PHONE_SIGNING_MATERIAL"])
          value = str((material.get("fingerprints") or {}).get("watch") or "")
          print(value.strip().lower())
          PY
          )"
          if ! printf '%s' "$FP" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "ERROR: fingerprints.watch 不是 64 位 hex 证书 SHA-256。" >&2
            echo "必须是当前 GT 4 HAP 的签名证书 DER-SHA256，不能用手机 HAP/APK 指纹。" >&2
            exit 1
          fi
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"

      - name: Build Stage HAP
        env:
          SUYUE_WATCH_FINGERPRINT: ${{ steps.watch-fingerprint.outputs.fingerprint }}
        run: tools/build_phone_hap.sh release

      - name: Locate HAP
        id: hap
        run: |
          HAP="$(find apps/phone/entry/build/default/outputs/default -name 'entry-default-release-*.hap' -type f | head -n 1)"
          if [ -z "$HAP" ]; then
            echo "ERROR: release HAP not found" >&2
            exit 1
          fi
          echo "path=$HAP" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$HAP")" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$HAP")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$HAP" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Verify HAP signature with hap-sign-tool
        # 证书签名验证：本步失败即失败，不能用
        # 「ZIP/清单检查」代替（P1-6）。
        env:
          HAP_SIGN_TOOL_JAR: ${{ vars.HAP_SIGN_TOOL_JAR }}
        run: |
          TOOL="$HAP_SIGN_TOOL_JAR"
          if [ -z "$TOOL" ]; then
            for candidate in \
              "$HOME/.harmony-cli/sdk/default/openharmony/toolchains/lib/hap-sign-tool.jar" \
              "$HOME/command-line-tools/sdk/default/openharmony/toolchains/lib/hap-sign-tool.jar" \
              /opt/deveco/toolchains/lib/hap-sign-tool.jar; do
              [ -f "$candidate" ] && TOOL="$candidate" && break
            done
          fi
          if [ -z "$TOOL" ] || [ ! -f "$TOOL" ]; then
            echo "ERROR: hap-sign-tool.jar 不可用（设置 repo variable HAP_SIGN_TOOL_JAR）。" >&2
            echo "未做证书签名验证的构建不能标记为成功。" >&2
            exit 1
          fi
          java -jar "$TOOL" verify-app \
            -inFile "${{ steps.hap.outputs.path }}" \
            -outCertChain "$RUNNER_TEMP/verify.cer" \
            -outProfile "$RUNNER_TEMP/verify.p7b"

      - name: Report artifact identity
        run: |
          echo "HAP name: ${{ steps.hap.outputs.name }}"
          echo "HAP size: ${{ steps.hap.outputs.size }} bytes"
          echo "HAP sha256: ${{ steps.hap.outputs.sha256 }}"

      - name: Upload Stage HAP only
        uses: actions/upload-artifact@v4
        with:
          name: suyue-phone-hap
          path: ${{ steps.hap.outputs.path }}
          if-no-files-found: error

      - name: Remove signing material and restore configs
        # 无论构建成败都执行：签名材料
        # 不得残留在工作区（施工单 P1-7）。
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/suyue-signing"
          git checkout -- apps/phone/build-profile.json5 \
            apps/phone/entry/src/main/ets/services/PeerIdentityConfig.g.ts
          echo "signing material removed; configs restored"
